services:
  opds-library:
    build: .
    image: opds-library:0.3.0
    ports:
      - "8080:8080"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      LIBRARY_PATH: /library
      DATA_PATH: /data
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      PAGE_SIZE: ${PAGE_SIZE:-50}
      SCRAPE_AUTO_THRESHOLD: ${SCRAPE_AUTO_THRESHOLD:-90}
      ORGANIZE_ENABLED: ${ORGANIZE_ENABLED:-false}
      ORGANIZE_TEMPLATE: ${ORGANIZE_TEMPLATE:-"{author}/{series}/{title}.{ext}"}
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
      WATCH_POLL_SECONDS: ${WATCH_POLL_SECONDS:-300}
      DOUBAN_ENABLED: ${DOUBAN_ENABLED:-true}
      # 本机开发默认指向宿主机上的 douban-book-api。
      # 若与下方可选服务一起用 Compose 启动，请改为 http://douban-book-api:3000
      DOUBAN_API_URL: ${DOUBAN_API_URL:-http://127.0.0.1:3000}
      DOUBAN_TIMEOUT_SECONDS: ${DOUBAN_TIMEOUT_SECONDS:-15}
      DOUBAN_MIN_INTERVAL_SECONDS: ${DOUBAN_MIN_INTERVAL_SECONDS:-3}
      DOUBAN_COVER_BROWSER_HEADERS: ${DOUBAN_COVER_BROWSER_HEADERS:-true}
    volumes:
      # 书库默认只读挂载，服务不会写回原文件内容。
      # 若要启用整理/改名（ORGANIZE_ENABLED=true），把下一行的 :ro 去掉，改为：
      #   - ${LIBRARY_HOST_PATH:-./library}:/library
      - ${LIBRARY_HOST_PATH:-./library}:/library:ro
      - ${DATA_HOST_PATH:-./data}:/data
    restart: unless-stopped

  # 可选：中文刮削用的 douban-book-api。默认不启动。
  # 启用：docker compose --profile douban up --build -d
  # 同时把 DOUBAN_API_URL 设为 http://douban-book-api:3000
  douban-book-api:
    profiles: ["douban"]
    image: douban-book-api:zzwen6
    build:
      context: https://github.com/zzwen6/douban-book-api.git#master
    ports:
      - "3000:3000"
    environment:
      CACHE_DIR: /cache
    volumes:
      - ${DOUBAN_CACHE_PATH:-./data/douban-cache}:/cache
    restart: unless-stopped

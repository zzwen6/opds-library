[project]
name = "opds-library"
version = "0.5.0"
description = "自用 Web 电子书管理站 + OPDS 1.2 / 2.0 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "ebooklib>=0.18",
  "pypdf>=5.1.0",
  "pillow>=11.0.0",
  "httpx>=0.27.0",
  "xxhash>=3.5.0",
  "lxml>=5.3.0",
  "mobi>=0.3.3",
  "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
